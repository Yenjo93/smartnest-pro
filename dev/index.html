<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SmartNest · Dev</title>
    <style>
      html, body { margin: 0; height: 100%; background: #8e867e; }
      #dev {
        position: fixed; bottom: 10px; right: 10px; z-index: 1000; display: flex; gap: 6px; padding: 6px;
        border-radius: 12px; opacity: .5; background: rgba(21,26,30,.85); font: 12px/1 ui-monospace, Menlo, monospace;
      }
      #dev:hover { opacity: 1; }
      #dev a { color: #fff; text-decoration: none; padding: 6px 8px; border-radius: 8px; background: #3a454f; }
    </style>
  </head>
  <body>
    <smartnest-pro-panel></smartnest-pro-panel>
    <div id="dev">
      <a href="?">EN</a><a href="?lang=ar">AR</a><a href="?dark">Dark</a><a href="?empty">Empty</a><a href="?user">User</a>
    </div>
    <script type="module">
      import "../src/main.ts";
      import { makeHass } from "./mock.ts";

      const panel = document.querySelector("smartnest-pro-panel");
      panel.panel = { config: { asset_base: "/custom_components/smartnest_pro/frontend/static/" } };
      const role = new URLSearchParams(location.search).has("user") ? "user" : "admin";
      panel.hass = makeHass((h) => (panel.hass = h), role);
    </script>
  </body>
</html>
